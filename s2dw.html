<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IGS Monitoring — S2DW</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101b2e;--panel2:#0c1728;--text:#edf4ff;--muted:#94a7c5;--border:#263a5c;--ok:#3ddc97;--bad:#ff6b78}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{width:min(1540px,calc(100% - 28px));margin:auto;padding:18px 0 34px}.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;margin-bottom:14px}h1{margin:0 0 5px;font-size:clamp(21px,2vw,29px)}.meta{color:var(--muted);font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.badge,.control{min-height:38px;display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel);font-size:14px}.control select{border:0;background:transparent;color:var(--text);font:inherit;max-width:100%}.control select option{background:var(--panel);color:var(--text)}.station-control{border-color:#446a9c}.station-control select{font-weight:650;min-width:140px}.control select:disabled{opacity:.7}.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:10px;margin-bottom:14px}.summary-item{padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.label{color:var(--muted);font-size:12px;margin-bottom:4px}.value{font-size:15px;font-weight:650}.stack{display:grid;gap:14px}.card{padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:10px}.title h2{margin:0 0 4px;font-size:18px}.unit{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;flex:1 1 900px}.stat{padding:8px 10px;border:1px solid rgba(118,149,192,.22);border-radius:9px;background:var(--panel2);min-width:0}.stat-label{color:var(--muted);font-size:11px;margin-bottom:3px}.stat-value{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart-box{height:340px}.footer{margin-top:13px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:1100px){.summary{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.summary{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.chart-box{height:270px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>Онлайн-моніторинг S2DW</h1><div class="meta" id="meta">Підключення до Firebase…</div></div>
<div class="controls"><label class="control station-control">Акселерометр: <select id="stationSelect" aria-label="Вибір онлайн-акселерометра" disabled><option value="">Пошук станцій…</option></select></label><label class="control">Інтервал: <select id="window"><option value="10">10 секунд</option><option value="60" selected>1 хвилина</option><option value="300">5 хвилин</option></select></label><label class="control"><input type="checkbox" id="pause"> Пауза</label><div class="badge"><span class="dot" id="dot"></span><span id="statusText">Очікування даних…</span></div></div></div>
<section class="summary"><div class="summary-item"><div class="label">Час оновлення (ПК)</div><div class="value" id="stationTime">—</div></div><div class="summary-item"><div class="label">Частота дискретизації</div><div class="value" id="sampleRate">—</div></div><div class="summary-item"><div class="label">Останнє оновлення</div><div class="value" id="age">—</div></div></section>
<main class="stack" id="stack"></main>
<div class="footer" id="footer">На сайт надходить 1 пакет/с; повний потік зберігається локально.</div>
</div>
<script>
const DB="https://igs-monitoring-default-rtdb.europe-west1.firebasedatabase.app";
// №02 retains its legacy Firebase path. New loggers must use these separate roots.
const STATIONS=Array.from({length:20},(_,i)=>{const id=String(i+1).padStart(2,"0");return {id,root:id==="02"?"/public/s2dw":"/public/s2dw"+id};});
const ONLINE_MS=300000, FUTURE_MS=5000, DISCOVERY_MS=5000;
let selectedId="", discoveryBusy=false, discoveryDone=false, discoveryFailed=false;
let stationStatuses=new Map();
const stationSelect=document.getElementById("stationSelect");
function isOnline(s,now=Date.now()){
 // A temporary disconnect flag must not remove a station during the 5-minute grace period.
 if(!s)return false;
 const upload=Number(s.updated_ms),data=Number(s.station_time_ms);
 return upload>0&&data>0&&now-upload>=-FUTURE_MS&&now-data>=-FUTURE_MS&&now-upload<ONLINE_MS&&now-data<ONLINE_MS;
}
function activeStation(){return STATIONS.find(s=>s.id===selectedId)}
function resetStation(){
 closeStreams();pointsBySlot.clear();status={};dirty=true;
 for(const chart of Object.values(charts)){for(const ds of chart.data.datasets)ds.data=[];chart.update("none")}
}
function chooseStation(id){
 if(id===selectedId)return;
 resetStation();selectedId=id;stationSelect.value=id;
 status=stationStatuses.get(id)||{};dirty=true;
 if(id&&!paused&&!document.hidden)connect();
 render();
}
function refreshStationMenu(){
 const online=STATIONS.filter(s=>isOnline(stationStatuses.get(s.id)));
 const next=online.some(s=>s.id===selectedId)?selectedId:(online[0]?.id||"");
 const options=online.map(s=>({value:s.id,label:"S2DW №"+s.id+" — онлайн"}));
 if(!options.length)options.push({value:"",label:!discoveryDone?"Пошук станцій…":discoveryFailed?"Статуси недоступні":"Немає онлайн-станцій"});
 const signature=JSON.stringify(options);
 if(stationSelect.dataset.signature!==signature){
  stationSelect.replaceChildren(...options.map(o=>new Option(o.label,o.value)));
  stationSelect.dataset.signature=signature;
 }
 stationSelect.disabled=!online.length;
 chooseStation(next);stationSelect.value=next;
}
async function discoverStations(){
 if(discoveryBusy||document.hidden)return;
 discoveryBusy=true;
 try{
  const results=await Promise.allSettled(STATIONS.map(async s=>{
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),4000);
   try{
    const res=await fetch(DB+s.root+"/status.json",{cache:"no-store",signal:controller.signal});
    if(!res.ok)throw new Error("HTTP "+res.status);
    return [s.id,await res.json()];
   }finally{clearTimeout(timer)}
  }));
  discoveryFailed=results.every(r=>r.status==="rejected");
  for(const r of results)if(r.status==="fulfilled")stationStatuses.set(r.value[0],r.value[1]);
  discoveryDone=true;refreshStationMenu();dirty=true;
 }finally{discoveryBusy=false}
}
const CHANNELS=["X","Y","Z"], G=9.80665;
const pointsBySlot=new Map();
let status={},pointSource=null,statusSource=null,dirty=true,paused=false;
const stack=document.getElementById("stack");
for(const n of CHANNELS){stack.insertAdjacentHTML("beforeend",`<section class="card"><div class="head"><div class="title"><h2>${n}</h2><div class="unit">Прискорення, м/с²</div></div><div class="stats" id="stats-${n}"></div></div><div class="chart-box"><canvas id="${n}"></canvas></div></section>`)}
function sci(v){if(!Number.isFinite(v))return"—";if(v===0)return"0";return Math.abs(v)>=1e-3&&Math.abs(v)<1e3?v.toLocaleString("uk-UA",{maximumSignificantDigits:5}):v.toExponential(3)}
function detail(v){return`${sci(v)} м/с² · ${sci(v/G)} g`}
function timeText(ms,full=false){if(!Number.isFinite(ms))return"—";return new Date(ms).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit",second:"2-digit",fractionalSecondDigits:full?3:undefined})}
const charts={};
for(const n of CHANNELS){
charts[n]=new Chart(document.getElementById(n),{type:"line",data:{datasets:[
{label:"Мінімум",data:[],borderColor:"rgba(77,178,255,0)",backgroundColor:"rgba(77,178,255,.14)",borderWidth:0,pointRadius:0,tension:0,fill:false},
{label:"Діапазон min–max",data:[],borderColor:"rgba(77,178,255,0)",backgroundColor:"rgba(77,178,255,.14)",borderWidth:0,pointRadius:0,tension:0,fill:"-1"},
{label:"Сигнал",data:[],borderColor:"#4db2ff",backgroundColor:"rgba(77,178,255,0)",borderWidth:1.1,pointRadius:0,pointHitRadius:7,tension:0,spanGaps:false}
]},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false,normalized:false,interaction:{mode:"nearest",intersect:false,axis:"x"},plugins:{legend:{display:false},decimation:{enabled:false},tooltip:{displayColors:false,filter:i=>i.datasetIndex===2,callbacks:{title:x=>x.length?timeText(x[0].parsed.x,true):"",label:c=>detail(c.parsed.y)}}},scales:{x:{type:"linear",ticks:{maxTicksLimit:9,color:"#94a7c5",callback:v=>timeText(Number(v))},grid:{color:"rgba(147,169,204,.14)"},title:{display:true,text:"Час",color:"#94a7c5"}},y:{grace:"8%",ticks:{color:"#94a7c5",callback:v=>sci(Number(v))},grid:{color:"rgba(147,169,204,.14)"},title:{display:true,text:"м/с²",color:"#94a7c5"}}}}})
}
function validRecord(r){return Array.isArray(r)&&r.length>=24&&Number.isFinite(Number(r[0]))}
function applyPointEvent(ev){const p=JSON.parse(ev.data),path=p.path,data=p.data;if(path==="/"){pointsBySlot.clear();if(data)for(const[k,v]of Object.entries(data))if(validRecord(v))pointsBySlot.set(k,v)}else{const k=path.replace(/^\//,"");if(data===null)pointsBySlot.delete(k);else if(validRecord(data))pointsBySlot.set(k,data)}dirty=true}
function applyPointPatch(ev){const p=JSON.parse(ev.data);if(p.path==="/"){for(const[k,v]of Object.entries(p.data||{})){if(v===null)pointsBySlot.delete(k);else if(validRecord(v))pointsBySlot.set(k,v)}}else applyPointEvent(ev);dirty=true}
function applyStatus(ev){const p=JSON.parse(ev.data);if(p.path==="/")status=p.data||{};else status[p.path.replace(/^\//,"")]=p.data;dirty=true}
function connect(){
 const station=activeStation();
 if(!station||paused||document.hidden)return;
 closeStreams();
 const ps=new EventSource(DB+station.root+"/points.json");
 pointSource=ps;
 ps.addEventListener("put",e=>{if(pointSource===ps)applyPointEvent(e)});
 ps.addEventListener("patch",e=>{if(pointSource===ps)applyPointPatch(e)});
 ps.onerror=()=>{if(pointSource===ps){document.getElementById("meta").textContent="Повторне підключення до Firebase…"}};
 const ss=new EventSource(DB+station.root+"/status.json");statusSource=ss;
 ss.addEventListener("put",e=>{if(statusSource===ss)applyStatus(e)});
 ss.addEventListener("patch",e=>{if(statusSource===ss)applyStatus(e)});
}
function closeStreams(){if(pointSource){pointSource.close();pointSource=null}if(statusSource){statusSource.close();statusSource=null}}
function statBox(l,v,t=""){return`<div class="stat" title="${t||v}"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`}
function appendWithGap(arr,p,maxGap){const prev=arr.at(-1);if(prev&&p.x-prev.x>maxGap)arr.push({x:(prev.x+p.x)/2,y:null});arr.push(p)}
function render(){
if(!dirty)return;dirty=false;
// The device logger previously sent future timestamps. Discard such points,
 // as well as old slots, rather than letting an invalid packet shift the chart.
const browserNow=Date.now();
const records=[...pointsBySlot.values()].filter(validRecord)
 .filter(r=>Number(r[0])>=browserNow-600000&&Number(r[0])<=browserNow+5000)
 .sort((a,b)=>Number(a[0])-Number(b[0]));
const bucketMs=Math.max(1,Number(status.bucket_seconds||1)*1000);
const newest=records.length?Number(records.at(-1)[0])+bucketMs:Date.now();
const win=Number(document.getElementById("window").value),cut=newest-win*1000;
const visible=records.filter(r=>Number(r[0])+bucketMs>=cut);
for(let c=0;c<3;c++){
const n=CHANNELS[c],base=2+c*6,lower=[],upper=[],signal=[];
let min=Infinity,max=-Infinity,peak=null,latest=NaN,sumSq=0,count=0,displayPoints=0;
for(const r of visible){
const t0=Number(r[0]),center=t0+bucketMs/2;
const minValue=Number(r[base+1]),maxValue=Number(r[base+3]),lastValue=Number(r[base+4]),rmsValue=Number(r[base+5]),samples=Number(r[1]);
appendWithGap(lower,{x:center,y:minValue},bucketMs*1.5);appendWithGap(upper,{x:center,y:maxValue},bucketMs*1.5);
const offsets=Array.isArray(r[20])?r[20]:null,sampled=Array.isArray(r[21+c])?r[21+c]:null;
if(offsets&&sampled&&offsets.length===sampled.length&&offsets.length){for(let j=0;j<offsets.length;j++){const x=t0+Number(offsets[j]),y=Number(sampled[j]);if(Number.isFinite(x)&&Number.isFinite(y))appendWithGap(signal,{x,y},100)}}else appendWithGap(signal,{x:t0+bucketMs,y:lastValue},100);
if(minValue<min)min=minValue;if(maxValue>max)max=maxValue;
const p1={x:t0+Number(r[base]),y:minValue},p2={x:t0+Number(r[base+2]),y:maxValue};
if(!peak||Math.abs(p1.y)>Math.abs(peak.y))peak=p1;if(!peak||Math.abs(p2.y)>Math.abs(peak.y))peak=p2;
latest=lastValue;sumSq+=rmsValue*rmsValue*samples;count+=samples;displayPoints+=offsets&&sampled&&offsets.length===sampled.length?offsets.length:1;
}
charts[n].data.datasets[0].data=lower;charts[n].data.datasets[1].data=upper;charts[n].data.datasets[2].data=signal;charts[n].options.scales.x.min=cut;charts[n].options.scales.x.max=newest+bucketMs;charts[n].update("none");
const rms=count?Math.sqrt(sumSq/count):NaN;
document.getElementById("stats-"+n).innerHTML=[
statBox("Поточне",detail(latest)),
statBox("Макс. |значення|",peak?detail(Math.abs(peak.y)):"—",peak?timeText(peak.x,true):""),
statBox("RMS",detail(rms)),
statBox("Мінімум",Number.isFinite(min)?detail(min):"—"),
statBox("Максимум",Number.isFinite(max)?detail(max):"—"),
statBox("Пакетів / точок",`${visible.length} / ${displayPoints}`,`Очікується близько ${Math.round(win*1000/bucketMs)} пакетів; розриви не з’єднуються`)
].join("");
}
const stationMs=Number(status.station_time_ms);
const uploadMs=Number(status.updated_ms);
const nowMs=Date.now();
const uploadValid=Number.isFinite(uploadMs)&&uploadMs>0;
const dataValid=Number.isFinite(stationMs)&&stationMs>0;
const invalidFuture=dataValid&&stationMs>nowMs+30000;
const uploadAge=uploadValid?(nowMs-uploadMs)/1000:null;
const dataAge=dataValid?(nowMs-stationMs)/1000:null;
const hasStatus=uploadValid||dataValid;
const online=!!selectedId&&isOnline(status,nowMs);
document.getElementById("dot").classList.toggle("ok",online);
document.getElementById("dot").classList.toggle("bad",hasStatus&&!online);
document.getElementById("statusText").textContent=!selectedId?(discoveryDone?(discoveryFailed?"Статуси недоступні":"Немає онлайн-станцій"):"Пошук станцій…"):(!hasStatus?"Очікування даних…":(invalidFuture?"Некоректний час даних":(online?"S2DW №"+selectedId+" онлайн":"S2DW №"+selectedId+" офлайн")));
document.getElementById("meta").textContent=selectedId?`S2DW №${selectedId} · LIS2DW12 · Firebase live · до ${Number(status.live_points_per_bucket||100)} реальних точок/с · показано ${win} с`:(discoveryDone?"Виберіть акселерометр, коли він з’явиться онлайн.":"Перевірка доступності акселерометрів…");
document.getElementById("stationTime").textContent=uploadValid?new Date(uploadMs).toLocaleString("uk-UA"):"—";
document.getElementById("sampleRate").textContent=status.sample_rate_hz?`${Number(status.sample_rate_hz).toLocaleString("uk-UA")} Гц`:"—";
document.getElementById("age").textContent=uploadAge===null?"—":`${Math.max(0,uploadAge).toFixed(1)} с тому`;
document.getElementById("footer").textContent=selectedId?`На сайт: 1 пакет/с, до ${Number(status.live_points_per_bucket||100)} реальних точок/с. Повний потік зберігається локально.`:"Графіки з’являться автоматично після надходження свіжих даних." ;
}
document.getElementById("window").addEventListener("change",()=>{dirty=true});
document.getElementById("pause").addEventListener("change",e=>{paused=e.target.checked;if(paused)closeStreams();else connect()});
stationSelect.addEventListener("change",e=>chooseStation(e.target.value));
document.addEventListener("visibilitychange",()=>{if(document.hidden)closeStreams();else{discoverStations();if(!paused)connect()}});
setInterval(()=>{dirty=true;render()},1000);setInterval(refreshStationMenu,1000);setInterval(discoverStations,DISCOVERY_MS);discoverStations();
</script>
</body>
</html>
