<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Онлайн-моніторинг ZIR-8</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07111f;
  --panel:#0a1729;
  --panel2:#0d1c31;
  --border:#28415f;
  --text:#f5f8fc;
  --muted:#9eb2ca;
  --blue:#35a9ff;
  --blueFill:rgba(53,169,255,.14);
  --green:#25d07f;
  --red:#ff5a6b;
  --grid:#203651;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{padding:10px}
.page{max-width:1800px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.title h1{font-size:24px;line-height:1.1;margin:0 0 3px;font-weight:800}
.title p{margin:0;color:var(--muted);font-size:11px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select{
  border:1px solid var(--border);background:#0c1a2d;color:var(--text);
  border-radius:7px;padding:7px 10px;font-size:12px
}
button{cursor:pointer}
button:hover{border-color:#4d739d}
button.green{background:#0d4b35;border-color:#1f8c64}
button.paused{background:#5c2530;border-color:#9b4052}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.info-card{border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:8px 12px;min-height:58px}
.info-label{color:var(--muted);font-size:10px;margin-bottom:4px}
.info-value{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}
.live-dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(37,208,127,.12)}
.channels{display:flex;flex-direction:column;gap:9px}
.channel{border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:8px 9px 7px}
.channel-top{display:grid;grid-template-columns:120px repeat(6,minmax(125px,1fr));gap:7px;align-items:stretch;margin-bottom:4px}
.channel-name{padding:5px 3px}
.channel-name .name{font-size:15px;font-weight:800}
.channel-name .unit{font-size:10px;color:var(--muted);margin-top:3px}
.metric{border:1px solid var(--border);background:#091629;border-radius:6px;padding:5px 8px;min-height:42px}
.metric .label{font-size:9px;color:var(--muted);margin-bottom:2px}
.metric .value{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-wrap{width:100%;height:205px;position:relative}
canvas{width:100%;height:100%;display:block}
.status-line{font-size:10px;color:var(--muted);margin:8px 2px 0}
@media(max-width:1100px){
  .overview{grid-template-columns:1fr}
  .channel-top{grid-template-columns:repeat(3,1fr)}
  .channel-name{grid-column:1/-1}
}
@media(max-width:650px){
  body{padding:6px}
  .channel-top{grid-template-columns:1fr 1fr}
  .chart-wrap{height:180px}
  .title h1{font-size:20px}
}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="title">
      <h1>Онлайн-моніторинг ZIR-8</h1>
      <p>Канали HHV · HHW · HHU · ACC · час станції +3 години</p>
    </div>
    <div class="controls">
      <label style="font-size:11px;color:var(--muted)">Інтервал:
        <select id="seconds">
          <option value="10">10 секунд</option>
          <option value="30" selected>30 секунд</option>
          <option value="60">1 хвилина</option>
          <option value="120">2 хвилини</option>
        </select>
      </label>
      <button id="pauseBtn">⏸ Пауза</button>
      <button id="csvBtn" class="green">● Скачати дані</button>
    </div>
  </header>

  <section class="overview">
    <div class="info-card">
      <div class="info-label">Статус / час станції</div>
      <div class="info-value"><span id="liveDot" class="live-dot"></span><span id="stationTime">Очікування…</span></div>
    </div>
    <div class="info-card">
      <div class="info-label">Частота дискретизації</div>
      <div id="frequency" class="info-value">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Дані</div>
      <div id="shape" class="info-value">—</div>
    </div>
  </section>

  <main class="channels" id="channels"></main>
  <div class="status-line" id="footStatus">Очікування потоку…</div>
</div>

<script>
const CHANNELS = [
  {id:"HHV", source:"HHV", title:"HHV", unit:"м/с"},
  {id:"HHW", source:"HHW", title:"HHW", unit:"м/с"},
  {id:"HHU", source:"HHU", title:"HHU", unit:"м/с"},
  {id:"ACC", source:"ACC_MS2", title:"ACC", unit:"м/с²"}
];

const channelsRoot = document.getElementById("channels");
let paused = false;
let latestPayload = null;

function fmt(v){
  if(!Number.isFinite(v)) return "—";
  const a=Math.abs(v);
  if(a!==0 && (a<0.001 || a>=10000)) return v.toExponential(3);
  return v.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
}
function safePoints(arr){
  return Array.isArray(arr) ? arr.filter(p=>Array.isArray(p)&&p.length>=2&&Number.isFinite(+p[0])&&Number.isFinite(+p[1])).map(p=>[+p[0],+p[1]]) : [];
}
function stats(points){
  const y=points.map(p=>p[1]).filter(Number.isFinite);
  if(!y.length) return {cur:NaN,max:NaN,min:NaN,rms:NaN,avg:NaN,median:NaN,count:0};
  const sorted=[...y].sort((a,b)=>a-b);
  const n=y.length;
  const median=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
  const avg=y.reduce((a,b)=>a+b,0)/n;
  return {
    cur:y[y.length-1], max:Math.max(...y), min:Math.min(...y),
    rms:Math.sqrt(y.reduce((s,v)=>s+v*v,0)/n),
    avg, median, count:n
  };
}
function metric(label,id){
  return `<div class="metric"><div class="label">${label}</div><div id="${id}" class="value">—</div></div>`;
}
for(const c of CHANNELS){
  const section=document.createElement("section");
  section.className="channel";
  section.innerHTML=`
    <div class="channel-top">
      <div class="channel-name"><div class="name">${c.title}</div><div class="unit">${c.unit}</div></div>
      ${metric("Поточне","m_cur_"+c.id)}
      ${metric("Макс. |амплітуда|","m_max_"+c.id)}
      ${metric("RMS","m_rms_"+c.id)}
      ${metric("Середнє","m_avg_"+c.id)}
      ${metric("Медіана","m_med_"+c.id)}
      ${metric("Точок / кадр","m_n_"+c.id)}
    </div>
    <div class="chart-wrap"><canvas id="chart_${c.id}"></canvas></div>`;
  channelsRoot.appendChild(section);
}

function setMetric(id,val,unit=""){
  document.getElementById(id).textContent = Number.isFinite(val) ? `${fmt(val)}${unit ? " "+unit : ""}` : "—";
}
function draw(canvas, points, unit){
  const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(rect.width*dpr));
  canvas.height=Math.max(1,Math.round(rect.height*dpr));
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=rect.width,h=rect.height;
  ctx.clearRect(0,0,w,h);
  const P={l:78,r:12,t:8,b:27},pw=w-P.l-P.r,ph=h-P.t-P.b;

  ctx.font="9px Segoe UI,Arial";
  ctx.strokeStyle="#203651";
  ctx.fillStyle="#9eb2ca";
  ctx.lineWidth=1;

  if(points.length<2){
    ctx.fillText("Немає даних",P.l+10,P.t+20);
    return;
  }
  let xmin=points[0][0],xmax=points[points.length-1][0];
  let ymin=Infinity,ymax=-Infinity;
  for(const [,y] of points){ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}
  const maxAbs=Math.max(Math.abs(ymin),Math.abs(ymax),1e-15);
  ymin=-maxAbs*1.08; ymax=maxAbs*1.08;

  const X=x=>P.l+(x-xmin)/(xmax-xmin||1)*pw;
  const Y=y=>P.t+(ymax-y)/(ymax-ymin)*ph;

  ctx.textAlign="right";ctx.textBaseline="middle";
  for(let i=0;i<=6;i++){
    const v=ymax-(ymax-ymin)*i/6, y=Y(v);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(w-P.r,y);ctx.stroke();
    ctx.fillText(fmt(v),P.l-7,y);
  }
  ctx.textAlign="center";ctx.textBaseline="top";
  for(let i=0;i<=6;i++){
    const t=xmin+(xmax-xmin)*i/6,x=X(t);
    ctx.beginPath();ctx.moveTo(x,P.t);ctx.lineTo(x,P.t+ph);ctx.stroke();
    ctx.fillText(new Date(t).toLocaleTimeString("uk-UA",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"}),x,P.t+ph+7);
  }

  const zero=Y(0);
  ctx.strokeStyle="#6f86a0";ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(P.l,zero);ctx.lineTo(w-P.r,zero);ctx.stroke();ctx.setLineDash([]);

  const grad=ctx.createLinearGradient(0,P.t,0,P.t+ph);
  grad.addColorStop(0,"rgba(53,169,255,.28)");
  grad.addColorStop(1,"rgba(53,169,255,.03)");
  ctx.beginPath();
  points.forEach((p,i)=>{
    const x=X(p[0]),y=Y(p[1]);
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.lineTo(X(points[points.length-1][0]),zero);
  ctx.lineTo(X(points[0][0]),zero);
  ctx.closePath();ctx.fillStyle=grad;ctx.fill();

  ctx.beginPath();
  points.forEach((p,i)=>{
    const x=X(p[0]),y=Y(p[1]);
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle="#35a9ff";ctx.lineWidth=.9;ctx.stroke();

  ctx.save();
  ctx.translate(10,P.t+ph/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle="#9eb2ca";ctx.font="9px Segoe UI,Arial";ctx.textAlign="center";
  ctx.fillText(unit,0,0);ctx.restore();

  ctx.fillStyle="#9eb2ca";ctx.textAlign="center";ctx.fillText("Час",P.l+pw/2,h-10);
}

async function update(){
  if(paused) return;
  const seconds=document.getElementById("seconds").value;
  try{
    const r=await fetch(`/api/data?seconds=${encodeURIComponent(seconds)}`,{cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    latestPayload=d;

    const s=d.status||{};
    document.getElementById("stationTime").textContent=s.station_time_plus_3h||s.message||"Онлайн";
    document.getElementById("frequency").textContent=Number.isFinite(+s.real_frequency_hz)?`${fmt(+s.real_frequency_hz)} Гц`:(Number.isFinite(+s.frequency_hz)?`${fmt(+s.frequency_hz)} Гц`:"—");
    document.getElementById("shape").textContent=`${s.channel_count??"—"} канали · ${s.samples_per_frame??"—"} точок/кадр`;
    document.getElementById("liveDot").classList.toggle("on",!!s.connected);
    document.getElementById("footStatus").textContent=s.connected?`Потік активний · кадрів отримано: ${s.frames_received??"—"}`:`${s.message||"Немає з'єднання"}`;

    for(const c of CHANNELS){
      const points=safePoints(d.series?.[c.source]);
      const st=stats(points);
      setMetric("m_cur_"+c.id,st.cur,c.unit);
      setMetric("m_max_"+c.id,Math.max(Math.abs(st.max||0),Math.abs(st.min||0)),c.unit);
      setMetric("m_rms_"+c.id,st.rms,c.unit);
      setMetric("m_avg_"+c.id,st.avg,c.unit);
      setMetric("m_med_"+c.id,st.median,c.unit);
      document.getElementById("m_n_"+c.id).textContent=`${st.count} / ${s.samples_per_frame??"—"}`;
      draw(document.getElementById("chart_"+c.id),points,c.unit);
    }
  }catch(e){
    document.getElementById("liveDot").classList.remove("on");
    document.getElementById("footStatus").textContent="Помилка отримання даних: "+e.message;
  }
}

document.getElementById("pauseBtn").addEventListener("click",()=>{
  paused=!paused;
  const b=document.getElementById("pauseBtn");
  b.textContent=paused?"▶ Продовжити":"⏸ Пауза";
  b.classList.toggle("paused",paused);
  if(!paused)update();
});
document.getElementById("seconds").addEventListener("change",update);
document.getElementById("csvBtn").addEventListener("click",()=>{
  if(!latestPayload) return;
  const rows=[["channel","time","value","unit"]];
  for(const c of CHANNELS){
    for(const [t,v] of safePoints(latestPayload.series?.[c.source])){
      rows.push([c.id,new Date(t).toISOString(),v,c.unit]);
    }
  }
  const csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`ZIR8_${new Date().toISOString().replaceAll(":","-")}.csv`;
  a.click();URL.revokeObjectURL(a.href);
});
window.addEventListener("resize",()=>latestPayload&&update());
setInterval(update,500);
update();
</script>
</body>
</html>
