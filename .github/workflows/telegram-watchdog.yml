name: Telegram station watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-station-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure website offline threshold is 15 minutes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("index.html", "st107.html", "mag.html"):
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              new = text.replace("age<300", "age<900")
              if new != text:
                  p.write_text(new, encoding="utf-8")
                  print(f"Updated {name}: 300s -> 900s")
              else:
                  print(f"No threshold change needed in {name}")
          PY

      - name: Check stations and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 telegram_watchdog.py

      - name: Persist watchdog state and threshold changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .watchdog_state.json index.html st107.html mag.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to persist"
            exit 0
          fi
          git commit -m "Update station watchdog state and thresholds"
          git pull --rebase origin main
          git push origin HEAD:main
