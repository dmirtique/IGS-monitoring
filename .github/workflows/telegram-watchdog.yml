name: Telegram station watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-watchdog.yml"
      - "telegram_watchdog.py"
      - "index.html"
      - "st107.html"
      - "mag.html"
  # GitHub allows a minimum 5-minute interval per cron expression.
  # Five offset 5-minute schedules give one watchdog launch each minute.
  schedule:
    - cron: "0-55/5 * * * *"
    - cron: "1-56/5 * * * *"
    - cron: "2-57/5 * * * *"
    - cron: "3-58/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-station-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify 5-minute offline threshold on all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "index.html": "const online=hasStatus&&age<300;",
              "st107.html": "const online=hasStatus&&age<300;",
              "mag.html": "const online=hasStatus&&age<300;",
          }

          for name, marker in expected.items():
              text = Path(name).read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{name}: expected 5-minute offline rule not found")
              print(f"{name}: 5-minute offline rule OK")
          PY

      - name: Check stations and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 telegram_watchdog.py

      - name: Persist watchdog state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .watchdog_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to persist"
            exit 0
          fi
          git commit -m "Update watchdog state"
          git pull --rebase origin main
          git push origin HEAD:main
