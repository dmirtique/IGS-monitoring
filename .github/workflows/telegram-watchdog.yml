name: Telegram station watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-watchdog.yml"
      - "telegram_watchdog.py"
      - "index.html"
      - "st107.html"
      - "mag.html"
      - "s2dw.html"
  # GitHub cron is not precise enough for 1-minute outage alerts.
  # Start a fresh long-lived monitor every 4 hours; each run checks every minute.
  schedule:
    - cron: "13 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-station-watchdog-continuous
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Watch stations continuously
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          end=$(( $(date +%s) + 15900 ))
          pass=0

          while [ "$(date +%s)" -lt "$end" ]; do
            pass=$((pass + 1))
            echo "Watchdog pass $pass at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            # A temporary network/Telegram error must not kill the monitor.
            python3 telegram_watchdog.py || echo "Watchdog pass failed; retrying in 60 s"

            # Persist only real state transitions. This also makes the next runner
            # inherit the correct online/offline state without duplicate alerts.
            if ! git diff --quiet -- .watchdog_state.json; then
              git add .watchdog_state.json
              git commit -m "Update watchdog state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi

            sleep 60
          done
