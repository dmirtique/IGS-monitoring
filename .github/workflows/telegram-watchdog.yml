name: Telegram station watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-watchdog.yml"
      - "telegram_watchdog.py"
      - "index.html"
      - "st107.html"
      - "mag.html"
  # GitHub Actions scheduled workflows have a practical 5-minute cadence.
  # Each run stays alive for 4 minutes and performs five checks 60 s apart,
  # giving us an effective one-minute station check cadence.
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-station-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify 5-minute offline threshold on all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "index.html": "const online=hasStatus&&age<300;",
              "st107.html": "const online=hasStatus&&age<300;",
              "mag.html": "const online=hasStatus&&age<300;",
          }

          for name, marker in expected.items():
              text = Path(name).read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{name}: expected 5-minute offline rule not found")
              print(f"{name}: 5-minute offline rule OK")
          PY

      - name: Check stations every minute and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          had_error=0
          for i in 1 2 3 4 5; do
            echo "Watchdog pass $i/5 at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python3 telegram_watchdog.py || had_error=1
            if [ "$i" -lt 5 ]; then
              sleep 60
            fi
          done
          exit $had_error

      - name: Persist watchdog state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .watchdog_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to persist"
            exit 0
          fi
          git commit -m "Update watchdog state"
          git pull --rebase origin main
          git push origin HEAD:main
