name: Telegram station watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-watchdog.yml"
      - "telegram_watchdog.py"
  # Five independent 5-minute schedules, offset by one minute.
  # Together they give one watchdog check each minute without keeping
  # a long-running Actions job alive for hours.
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-station-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stations once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Start from the newest saved watchdog state.
          git pull --rebase origin main

          echo "Watchdog check at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 telegram_watchdog.py

          # Persist only a real online/offline transition.
          if ! git diff --quiet -- .watchdog_state.json; then
            git add .watchdog_state.json
            git commit -m "Update watchdog state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
