name: Telegram station watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-station-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stations and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 telegram_watchdog.py

      - name: Persist watchdog state
        if: always()
        run: |
          if git diff --quiet -- .watchdog_state.json 2>/dev/null && [ -f .watchdog_state.json ]; then
            echo "Watchdog state unchanged"
            exit 0
          fi
          if [ ! -f .watchdog_state.json ]; then
            echo "No watchdog state file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .watchdog_state.json
          git commit -m "Update station watchdog state" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
